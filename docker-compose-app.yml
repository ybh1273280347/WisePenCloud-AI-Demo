services:
  chat-service:
    image: ${DOCKER_REGISTRY}/wisepencloud-chat:${APP_VERSION}
    container_name: wisepen-chat-service
    restart: always

    extra_hosts:
      - "wisepen-dev-server:10.176.44.11"

    environment:
      - TZ=Asia/Shanghai
      - PROFILE=dev
      - NACOS_SERVER_ADDR=wisepen-dev-server:8848
      - NACOS_NAMESPACE_ID=
      - NACOS_GROUP=DEFAULT_GROUP
      - NACOS_USERNAME=${NACOS_USERNAME}
      - NACOS_PASSWORD=${NACOS_PASSWORD}
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=9200
      - LOG_LEVEL=INFO
      - SEARCH_PROVIDER_CREDENTIAL_MASTER_KEY=${SEARCH_PROVIDER_CREDENTIAL_MASTER_KEY}
      - SEARCH_PROVIDER_CREDENTIAL_KEY_ID=${SEARCH_PROVIDER_CREDENTIAL_KEY_ID}
      - SEARCH_PROVIDER_CREDENTIAL_HMAC_SECRET=${SEARCH_PROVIDER_CREDENTIAL_HMAC_SECRET}

      # baked model cache
      - HF_HOME=/opt/wisepen/models/huggingface
      - HF_TOKEN=${HF_TOKEN}

      # translation_assist
      - TRANSLATION_DEVICE=cpu

      # math_compute Sage backend
      - MATH_SAGE_ENABLED=true

      # web_search / web_fetch external services
      - SEARXNG_BASE_URL=http://searxng:8080
      - STEEL_BASE_URL=http://steel-browser:3000

    volumes:
      - ../logs/chat:/logs
    ports:
      - "${CHAT_SERVICE_PORT:-9200}:9200"
    networks:
      wisepen-net:
        aliases:
          - chat-service
    depends_on:
      searxng:
        condition: service_healthy
      steel-browser:
        condition: service_healthy
      sage-math-worker:
        condition: service_healthy

  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: searxng
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      wisepen-net:
        aliases:
          - searxng
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5).read()\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  steel-browser:
      image: ghcr.io/steel-dev/steel-browser-api:latest
      container_name: steel-browser
      restart: always
      environment:
        - TZ=Asia/Shanghai
        - DOMAIN=steel-browser:3000
        - CDP_DOMAIN=steel-browser:9223
        - CHROME_HEADLESS=true
        - LOG_LEVEL=warn
        - LOG_STORAGE_ENABLED=true
        - LOG_STORAGE_PATH=/data/logs/browser-logs.duckdb
      volumes:
        - steel-logs:/data/logs
        - steel-exports:/tmp/steel-browser-exports
      networks:
        wisepen-net:
          aliases:
            - steel-browser
      healthcheck:
        test:
          [
            "CMD-SHELL",
            "curl --fail --silent --show-error http://localhost:3000/v1/health >/dev/null || exit 1"
          ]
        interval: 30s
        timeout: 10s
        retries: 10
        start_period: 90s

  sage-math-worker:
    image: ${DOCKER_REGISTRY}/wisepencloud-sage-math-worker:${APP_VERSION}
    container_name: sage-math-worker
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    cpus: "2.0"
    mem_limit: 4g
    networks:
      wisepen-net:
        aliases:
          - sage-math-worker
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sage -python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  steel-logs:
    driver: local
  steel-exports:
    driver: local

networks:
  wisepen-net:
    external: true
    name: wisepen-net
