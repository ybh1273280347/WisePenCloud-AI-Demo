[project]
name = "wisepen-chat-service"
version = "0.1.0"
description = "WisePen Chat Microservice: RAG & LLM Orchestration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jiazheng Sun", email = "jzsun24@m.fudan.edu.cn" }
]
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn[standard]",
    "dependency_injector",
    "litellm",
    "mem0ai[nlp]",
    "openai",
    "beanie",
    "redis",
    "nacos-sdk-python",
    "pyyaml",
    "jieba",
    "rank-bm25",
    "zeroentropy",
    "wisepen-common",
    "httpx",
    "steel-sdk",
    "trafilatura",
    "playwright",
    "pymupdf",
    "marker-pdf>=1.10.2,<1.11",
    "markitdown",
    "pandas",
    "markdown-it-py",
    "openpyxl",
    "cachetools",
    "langchain-text-splitters",
    "magika",
    "fastembed",
    "dnspython",
    "docling",
    "paddleocr",
    "paddlepaddle==3.1.1",
    "recognizers-text-suite==1.0.2a2",
    "recognizers-text-date-time==1.0.2a2",
    "emoji<2",
    "chinesecalendar",
    "sympy",
    "numpy",
    "scipy",
    "transformers",
    "torch",
    "sentencepiece",
    "sacremoses",
    "puremagic",
    "cryptography>=48.0.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
